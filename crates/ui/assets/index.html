<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="dark" name="color-scheme"/>
  <title>
   OpenVPN Proxy · Status
  </title>
  <link href="/favicon.svg" rel="icon" type="image/svg+xml"/>
  <link href="/style.css" rel="stylesheet"/>
  <script src="/app.js" type="module" onerror="document.getElementById('boot-status').textContent = 'Could not load the dashboard. Check CDN access and reload.'">
  </script>
 </head>
 <body>
  <p class="boot-status" id="boot-status" role="status">Loading dashboard…</p>
  <div class="shell" x-cloak="" x-data="shell">
   <header class="topbar">
    <div class="brand">
     <div aria-hidden="true" class="brand-mark">
      <span>
      </span>
      <span>
      </span>
      <span>
      </span>
     </div>
     <div>
      <div class="eyebrow">
       NETWORK OPERATIONS
      </div>
      <h1>
       OpenVPN Proxy
      </h1>
     </div>
    </div>
    <div class="topbar-right">
     <div class="topbar-time">
      <span>
       Last update
      </span>
      <strong id="last-update" x-text="$store.dashboard.snapshot ? new Date($store.dashboard.snapshot.sampled_at_ms).toLocaleTimeString() : '—'">
       —
      </strong>
     </div>
     <div :class="$store.dashboard.feedKind" class="feed-status" id="feed-status">
      <span class="status-dot">
      </span>
      <span id="feed-label" x-text="$store.dashboard.feedLabel">
       Connecting
      </span>
     </div>
     <div class="shutdown-control">
      <button class="shutdown-button" id="shutdown-button" type="button" @click="shutdown()" :disabled="shuttingDown" x-text="shutdownAccepted ? 'Shutdown requested' : shuttingDown ? 'Shutting down…' : 'Shut down'">Shut down</button>
      <span class="shutdown-error" id="shutdown-error" role="status" x-show="shutdownError" x-text="shutdownError"></span>
     </div>
    </div>
   </header>
   <nav @keydown.arrow-left="moveTab($event)" @keydown.arrow-right="moveTab($event)" @keydown.end="moveTab($event)" @keydown.home="moveTab($event)" aria-label="Dashboard sections" class="tabs" role="tablist">
    <button :aria-selected="$store.dashboard.tab === 'overview'" :class="{ active: $store.dashboard.tab === 'overview' }" :tabindex="$store.dashboard.tab === 'overview' ? 0 : -1" @click="selectTab('overview')" aria-controls="overview" aria-selected="true" class="tab" data-tab="overview" id="tab-overview" role="tab" type="button">
     Overview
    </button>
    <button :aria-selected="$store.dashboard.tab === 'hosts'" :class="{ active: $store.dashboard.tab === 'hosts' }" :tabindex="$store.dashboard.tab === 'hosts' ? 0 : -1" @click="selectTab('hosts')" aria-controls="hosts" aria-selected="false" class="tab" data-tab="hosts" id="tab-hosts" role="tab" type="button">
     Hosts
    </button>
    <button :aria-selected="$store.dashboard.tab === 'routing'" :class="{ active: $store.dashboard.tab === 'routing' }" :tabindex="$store.dashboard.tab === 'routing' ? 0 : -1" @click="selectTab('routing')" aria-controls="routing" aria-selected="false" class="tab" data-tab="routing" id="tab-routing" role="tab" type="button">
     Routing
    </button>
    <button :aria-selected="$store.dashboard.tab === 'profile'" :class="{ active: $store.dashboard.tab === 'profile' }" :tabindex="$store.dashboard.tab === 'profile' ? 0 : -1" @click="selectTab('profile')" aria-controls="profile" aria-selected="false" class="tab" data-tab="profile" id="tab-profile" role="tab" type="button">
     Profile
    </button>
    <button :aria-selected="$store.dashboard.tab === 'configuration'" :class="{ active: $store.dashboard.tab === 'configuration' }" :tabindex="$store.dashboard.tab === 'configuration' ? 0 : -1" @click="selectTab('configuration')" aria-controls="configuration" aria-selected="false" class="tab" data-tab="configuration" id="tab-configuration" role="tab" type="button">
     Configuration
    </button>
    <button :aria-selected="$store.dashboard.tab === 'logs'" :class="{ active: $store.dashboard.tab === 'logs' }" :tabindex="$store.dashboard.tab === 'logs' ? 0 : -1" @click="selectTab('logs')" aria-controls="logs" aria-selected="false" class="tab" data-tab="logs" id="tab-logs" role="tab" type="button">
     Logs
    </button>
   </nav>
   <main :class="{ 'has-critical-warning': $store.dashboard.snapshot?.configuration?.file_missing }">
    <div class="critical-warning" id="configuration-missing-warning" x-show="$store.dashboard.snapshot?.configuration?.file_missing" x-cloak role="alert">
     <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 2 21h20L12 3Z" stroke-linejoin="round"/><path d="M12 9v5m0 3v1" stroke-linecap="round"/></svg>
     <div>
      <strong>VPN configuration file missing</strong>
      <p x-text="$store.dashboard.snapshot?.configuration?.message"></p>
      <button class="config-button" @click="selectTab('configuration')" type="button">Choose another configuration</button>
     </div>
    </div>
    {{overview}}
    {{hosts}}
    {{routing}}
    {{profile}}
    {{configuration}}
    {{logs}}
   </main>
   <footer>
    <span>Proxy dashboard</span>
    <span>Live status via WebSocket</span>
    <span>Counters and chart history reset when the app restarts</span>
   </footer>
  </div>
  <noscript>
   Enable JavaScript to use the live dashboard.
  </noscript>
 </body>
</html>
